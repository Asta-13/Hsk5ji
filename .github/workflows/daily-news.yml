name: Daily news

concurrency:
  group: news
  cancel-in-progress: false

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Fetch fresh news
        run: python3 Reel/make_news.py data/news.json

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "hsk-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "news: auto update"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
