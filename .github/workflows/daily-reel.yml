name: Daily reel

concurrency: reel

on:
  schedule:
    - cron: '0 23,1,3,5,7,9,11,13,15,17 * * *'
  workflow_dispatch:
    inputs:
      word:
        description: 'Specific word (optional, e.g. 爱)'
        required: false
      level:
        description: 'HSK level 1-6 (optional)'
        required: false
      mn_voice:
        description: 'Mongolian voice (optional): mn-MN-YesuiNeural or mn-MN-BataaNeural'
        required: false
      mn_rate:
        description: 'Mongolian speed (optional, e.g. -12% or +0%)'
        required: false

permissions:
  contents: write

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-dejavu-core
          pip install edge-tts pillow pypinyin
      - name: Get reels branch
        run: |
          git clone --branch reels --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" reels-out || mkdir reels-out
          rm -rf reels-out/.git
      - name: Make reel
        env:
          TZ: Asia/Ulaanbaatar
          WORD: ${{ github.event.inputs.word }}
          LEVEL: ${{ github.event.inputs.level }}
          MN_VOICE: ${{ github.event.inputs.mn_voice }}
          MN_RATE: ${{ github.event.inputs.mn_rate }}
          REEL_OUT: ${{ github.workspace }}/reels-out
        run: |
          ARGS=""
          if [ -n "$WORD" ]; then ARGS="$ARGS --word $WORD"; fi
          if [ -n "$LEVEL" ]; then ARGS="$ARGS --level $LEVEL"; fi
          SCRIPT=$(find . -iname make_reel.py -not -path './reels-out/*' | head -1)
          python3 "$SCRIPT" $ARGS
      - name: Publish to reels branch
        working-directory: reels-out
        run: |
          git init -b reels
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A
          git commit -m "Reels"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git push -f origin reels
