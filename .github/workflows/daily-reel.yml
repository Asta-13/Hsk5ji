name: Daily reel

# reel болон scene нэг группт: зэрэг ажиллаж `reels` салбарыг бие биенийхээ дээр дарж бичихгүй.
# cancel-in-progress: false — өмнө нь ажиллаж буй видеог шинэ trigger таслахгүй.
concurrency:
  group: reel
  cancel-in-progress: false

on:
  schedule:
    # GitHub нь `schedule`-ийг ачаалал ихтэй үед алгасдаг/хойшлуулдаг.
    # Иймд цаг бүрт 4 удаа оролдоно; хэт олон гарвал эхний алхамд байгаа gap-шалгалт алгасна.
    # UTC 22:00–17:59 = Улаанбаатар 06:00–01:59.
    - cron: '7,22,37,52 22-23,0-17 * * *'
  workflow_dispatch:
    inputs:
      word:
        description: 'Specific word (optional, e.g. 爱)'
        required: false
      level:
        description: 'HSK level 1-6 (optional)'
        required: false
      mn_voice:
        description: 'Mongolian voice (optional): mn-MN-YesuiNeural or mn-MN-BataaNeural'
        required: false
      mn_rate:
        description: 'Mongolian speed (optional, e.g. -12% or +0%)'
        required: false
      auto:
        description: 'true бол автомат горим (gap шалгана). Гадны цагийн trigger (cron-job.org) үүнийг ашиглана'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      MIN_GAP_MIN: '50'
      TZ: Asia/Ulaanbaatar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Get reels branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm -rf reels-out
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$URL" reels >/dev/null 2>&1; then
            git clone -q --branch reels --depth 1 "$URL" reels-out
            rm -rf reels-out/.git
          else
            mkdir reels-out
          fi

      - name: Move old files to days/legacy (one time)
        run: |
          set -euo pipefail
          [ -d reels-out/days ] || python3 Reel/organize.py legacy reels-out

      - name: Early gap check
        id: gap
        env:
          EVENT: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ] || [ "$AUTO" = "true" ]; then
            python3 Reel/gap_check.py reels-out/state.json "$MIN_GAP_MIN"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.gap.outputs.skip != 'true'
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk fonts-dejavu-core
          pip install -q --retries 5 --timeout 30 -r Reel/requirements.txt

      - name: Make reel
        id: make
        if: steps.gap.outputs.skip != 'true'
        timeout-minutes: 11
        env:
          PYTHONUNBUFFERED: '1'
          WATCHDOG_SEC: '600'
          EVENT: ${{ github.event_name }}
          AUTO: ${{ github.event.inputs.auto }}
          WORD: ${{ github.event.inputs.word }}
          LEVEL: ${{ github.event.inputs.level }}
          MN_VOICE: ${{ github.event.inputs.mn_voice }}
          MN_RATE: ${{ github.event.inputs.mn_rate }}
          REEL_OUT: ${{ github.workspace }}/reels-out
        run: |
          set -euo pipefail
          args=()
          if [ -n "$WORD" ]; then
            [[ "$WORD" =~ ^[^[:space:]-][^[:space:]]{0,5}$ ]] || { echo "::error::word буруу"; exit 1; }
            args+=(--word "$WORD")
          fi
          if [ -n "$LEVEL" ]; then
            [[ "$LEVEL" =~ ^[1-6]$ ]] || { echo "::error::level 1-6 байх ёстой"; exit 1; }
            args+=(--level "$LEVEL")
          fi
          case "$MN_VOICE" in ''|mn-MN-YesuiNeural|mn-MN-BataaNeural) ;; *) echo "::error::mn_voice буруу"; exit 1;; esac
          [[ -z "$MN_RATE" || "$MN_RATE" =~ ^[+-][0-9]{1,2}%$ ]] || { echo "::error::mn_rate буруу (жишээ -12%)"; exit 1; }
          if [ "$EVENT" = "schedule" ] || [ "$AUTO" = "true" ]; then
            args+=(--min-gap "$MIN_GAP_MIN")
          fi
          python3 Reel/make_reel.py "${args[@]}"

      - name: Organize by day (zip, keep 3 days)
        if: steps.gap.outputs.skip != 'true' && steps.make.outputs.skipped != 'true'
        run: python3 Reel/organize.py daily reels-out --keep-days 3

      - name: Publish to reels branch
        if: steps.gap.outputs.skip != 'true' && steps.make.outputs.skipped != 'true'
        working-directory: reels-out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q -b reels
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Reels"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:refs/heads/reels
