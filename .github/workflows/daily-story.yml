name: Daily story video

concurrency:
  group: daily-story
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 2 * * *'     # өдөр бүр 10:30 (Монгол/Хятад цаг)
  push:
    branches: [main]
    paths: ['Reel/stories/*.json']
  workflow_dispatch:
    inputs:
      max:
        description: 'Хамгийн ихдээ хэдэн шинэ видео үүсгэх'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu-core
          pip install -q --retries 5 --timeout 30 -r Reel/requirements.txt pypinyin playwright
          python -m playwright install --with-deps chromium

      - name: Render new story videos (with voice)
        env:
          MAX: ${{ github.event.inputs.max || '1' }}
        run: python Reel/render_stories.py --max "$MAX" --tts

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video data/stories.json
          git diff --cached --quiet && { echo "Шинэ видео алга"; exit 0; }
          git commit -m "New story video(s)"
          git pull --rebase origin main
          git push origin HEAD:main
