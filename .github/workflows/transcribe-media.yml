name: Transcribe media

concurrency:
  group: transcribe-media
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths: ['media/*', 'Reel/transcribe_media.py']
  workflow_dispatch:
    inputs:
      model:
        description: 'Whisper загвар: tiny / base / small / medium'
        required: false
        default: 'small'

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Cache Whisper model
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ github.event.inputs.model || 'small' }}

      - name: Install
        run: pip install faster-whisper opencc-python-reimplemented

      - name: Transcribe new files
        env:
          WHISPER_MODEL: ${{ github.event.inputs.model || 'small' }}
        run: python Reel/transcribe_media.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-auto.json
          git diff --cached --quiet && { echo "Өөрчлөлт алга"; exit 0; }
          git commit -m "Auto subtitles for media files"
          git pull --rebase origin main
          git push origin HEAD:main
