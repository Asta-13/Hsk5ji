<head>

<style>
#boot{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#EDF0F3;color:#131A24;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .25s}
@media(prefers-color-scheme:dark){#boot{background:#0F141C;color:#E7ECF3}}
#boot.hide{opacity:0;pointer-events:none}
#boot .bsp{width:44px;height:44px;border-radius:50%;border:4px solid rgba(128,140,160,.35);border-top-color:#5B7CFA;animation:bspin .9s linear infinite}
#boot .bt{font-size:1rem;opacity:.85;text-align:center;padding:0 24px}
#boot .bbar{width:min(260px,70vw);height:6px;border-radius:3px;background:rgba(128,140,160,.3);overflow:hidden}
#boot .bbar i{display:block;height:100%;width:6%;background:#5B7CFA;transition:width .3s}
#boot button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid rgba(128,140,160,.5);background:transparent;color:inherit}
@keyframes bspin{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="boot" role="status" aria-live="polite"><div class="bsp"></div><div class="bt" id="bootT">Ачаалж байна…</div><div class="bbar"><i id="bootBar"></i></div></div>
<div class="wrap">
<div class="langbar"><select id="lang" aria-label="Language"><option value="mn">Монгол</option><option value="en">English</option><option value="ru">Русский</option><option value="ja">日本語</option></select></div>

<!-- TODAY -->
<div class="pane" id="p-today" role="tabpanel">
  <div class="banner" id="notice" hidden><b data-i18n="noticeLbl"></b><span id="noticeTx"></span></div>
  <div class="card hero" id="dayCard" hidden>
    <div class="between"><span class="badge" data-i18n="dayWord"></span><button class="btn small" type="button" data-goplay="1" data-i18n="plGoBtn"></button></div>
    <div id="dayBody"></div>
  </div>
  <div class="card" id="taskCard" hidden></div>
  <div class="card" id="dueCard" hidden><button class="btn" type="button" id="dueBtn" hidden></button> <button class="btn" type="button" id="missDueBtn" hidden></button> <button class="btn" type="button" id="srsBtn" hidden></button></div>
  <div class="card" id="instCard" hidden><button class="btn" type="button" id="instBtn" data-i18n="instBtn"></button><div class="hint" data-i18n="instHint"></div></div>
  <div class="card" id="lrnCard" hidden><button class="btn" type="button" data-golearn="1" data-i18n="lrnCard"></button></div>

  <div class="card" id="auth" hidden>
    <h2 data-i18n="authTitle"></h2>
    <div class="hint" data-i18n="authHint"></div>
    <div class="note" data-i18n="authSteps"></div>
    <label class="f" for="auUser"><span data-i18n="loginName"></span><input id="auUser" type="text" inputmode="email" autocapitalize="none" autocorrect="off" autocomplete="username" maxlength="60"></label>
    <label class="f" for="auPass"><span data-i18n="password"></span><input id="auPass" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="btn" id="auIn" type="button" data-i18n="signIn"></button><button class="btn ghost" id="auUp" type="button" data-i18n="signUp"></button></div>
    <button class="btn ghost small" id="auForgot" type="button" style="align-self:flex-start" data-i18n="forgot"></button>
    <div class="hint" data-i18n="authNote"></div>
  </div>
  <div class="card hero" id="recov" hidden>
    <h2 data-i18n="resetTitle"></h2>
    <label class="f" for="rcPass"><span data-i18n="accPass"></span><input id="rcPass" type="password" autocomplete="new-password"></label>
    <button class="btn" id="rcSave" type="button" data-i18n="resetSave"></button>
  </div>
  <div class="card" id="onb" hidden>
    <h2 data-i18n="obTitle"></h2>
    <div class="note" id="obStep" data-i18n="obStep" style="border-left:4px solid var(--seal);font-weight:700"></div>
    <div class="hint" data-i18n="obHint"></div>
    <label class="f" for="obNick"><span data-i18n="nick"></span><input id="obNick" type="text" maxlength="24" data-i18n-ph="obNickPh"></label>
    <details id="obMore" style="margin:2px 0"><summary class="hint" style="cursor:pointer;padding:6px 0" data-i18n="obMore"></summary>
    <div><div class="label" style="margin-bottom:8px" data-i18n="level"></div><div class="chips" id="obLv"></div></div>
    <div class="grid2">
      <label class="f" for="obExam"><span data-i18n="examDate"></span><input id="obExam" type="date"></label>
      <label class="f" for="obMin"><span data-i18n="dailyTime"></span><select id="obMin"></select></label>
    </div>
    </details>
    <button class="btn" id="obSave" type="button" data-i18n="start"></button>
    <div class="hint" id="obNote"></div>
  </div>

  <div class="card" id="lvPick" hidden>
    <h2 data-i18n="lvPickT"></h2>
    <div class="chips" id="lvPickChips"></div>
    <div class="hint" data-i18n="lvPickH"></div>
    <button class="btn ghost small" id="lvPickLater" type="button" style="align-self:flex-start" data-i18n="lvPickLater"></button>
  </div>

  <div class="card" id="heroCard">
    <div class="hero">
      <div class="seal" id="seal"><span data-i18n="sealA"></span><b id="days">—</b><span data-i18n="sealB"></span></div>
      <div>
        <div class="label" id="examLbl"></div>
        <h1 id="lvTitle"></h1>
        <div class="muted" id="sub" style="font-size:.9rem"></div>
        <div class="hint" id="planLine"></div>
        <button class="chip" type="button" id="taskRemind" hidden></button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stToday">0</b><span data-i18n="stToday"></span></div>
      <div class="stat"><b id="stTotal">0</b><span data-i18n="stTotal"></span></div>
      <div class="stat"><b id="stStreak">0</b><span data-i18n="stStreak"></span></div>
    </div>
    <div>
      <div class="between"><span class="hint" data-i18n="lvProgLbl"></span><span class="hint" id="lvProgTx"></span></div>
      <div class="bar" style="margin-top:4px"><i id="lvProg"></i></div>
    </div>
  </div>

  <div class="card">
    <div class="label" data-i18n="phaseLbl"></div>
    <div class="phase-now" id="phaseNow"></div>
  </div>

  <div class="card">
    <div class="between"><h2 data-i18n="todayPlan"></h2><span class="label" id="todayLabel"></span></div>
    <div class="prog-ring">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="ringFg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/><text x="32" y="33" id="ringTx">0%</text></svg>
      <div><b id="doneTxt"></b><div class="hint" id="doneMsg"></div></div>
    </div>
    <ul id="tasks"></ul>
    <button class="btn ghost small" id="reset" type="button" style="align-self:flex-start" data-i18n="resetChecks"></button>
  </div>
</div>

<!-- WORDS -->
<div class="pane" id="p-words" role="tabpanel" hidden>
  <div class="card">
    <h2 data-i18n="wTitle"></h2>
    <form id="addForm" autocomplete="off" style="display:flex;flex-direction:column;gap:10px">
      <div class="grid2">
        <label class="f" for="fH"><span data-i18n="fHan"></span><input class="han" id="fH" type="text" lang="zh" placeholder="例如：参加"></label>
        <label class="f" for="fP"><span data-i18n="fPin"></span><input id="fP" type="text" placeholder="can1jia1 → cānjiā"></label>
      </div>
      <div id="fInfo" class="hint" aria-live="polite" style="display:flex;flex-direction:column;gap:6px"></div>
      <label class="f" for="fM"><span data-i18n="fMean"></span><input id="fM" type="text" data-i18n-ph="fMeanPh"></label>
      <label class="f" for="fE"><span data-i18n="fEx"></span><input id="fE" type="text" lang="zh" placeholder="我想参加比赛。"></label>
      <div class="grid2">
        <label class="f" for="fL"><span data-i18n="level"></span><select id="fL"></select></label>
        <label class="f" for="fD"><span data-i18n="fDate"></span><input id="fD" type="date"></label>
      </div>
      <button class="btn" type="submit" data-i18n="addBtn"></button>
      <div class="hint" data-i18n-html="pinHint"></div>
    </form>
  </div>
  <div class="card">
    <details>
      <summary data-i18n="bulkSum"></summary>
      <div style="display:flex;flex-direction:column;gap:10px;padding-top:6px">
        <div class="hint" data-i18n-html="bulkHint"></div>
        <textarea id="bulk" data-i18n-aria="bulkAria" data-i18n-ph="bulkPh" lang="zh"></textarea>
        <button class="btn" id="bulkBtn" type="button" data-i18n="bulkBtn"></button>
      </div>
    </details>
  </div>
  <div class="card">
    <div class="between"><h2 data-i18n="myWords"></h2><span class="hint" id="storeNote"></span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="wlQ" type="search" data-i18n-ph="hskSearch" autocomplete="off" enterkeyhint="search"><button type="button" class="sx" data-clear="wlQ" aria-label="×" hidden>×</button></div>
    <div class="chips" id="wlLv"></div>
    <div id="wordList" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
</div>

<!-- BEGINNER -->
<div class="pane" id="p-learn" role="tabpanel" hidden>
  <div id="lrnNext"></div>
  <div class="card hero">
    <div class="between"><h2 data-i18n="lrnTitle"></h2><button class="btn small ghost" id="lrnBack" type="button" data-i18n="plBack"></button></div>
    <div class="hint" data-i18n="lrnSub"></div>
    <div class="row" style="flex-wrap:wrap"><button class="chip" type="button" id="pyOpen" data-i18n="lrnPy" aria-pressed="false"></button><button class="chip" type="button" id="cyrTog" data-i18n="lrnCyr" aria-pressed="true"></button><button class="chip" type="button" id="tcTog" data-i18n="lrnTc" aria-pressed="true"></button><button class="chip" type="button" id="pyTog" data-i18n="lrnPyHide" aria-pressed="false"></button><button class="chip" type="button" id="cmpOpen" data-i18n="lrnCmp" aria-pressed="false"></button><button class="chip" type="button" id="toneOpen" data-i18n="lrnTone" aria-pressed="false"></button><button class="chip" type="button" id="decOpen" data-i18n="lrnDec" aria-pressed="false"></button><button class="chip" type="button" id="dictOpen" data-i18n="lrnDict" aria-pressed="false"></button></div>
    <div id="cmpBox" hidden></div>
    <div id="toneBox" hidden></div>
    <div id="decBox" hidden></div>
    <div id="dictBox" hidden></div>
    <div id="pyBox" hidden></div>
    <div id="tcLeg" class="tcleg" hidden></div>
    <div class="prog"><i id="lrnBar"></i></div>
    <div class="hint" id="lrnProg"></div>
  </div>
  <div id="lrnList" class="list"></div>
</div>

<!-- PLAY -->
<div class="pane" id="p-play" role="tabpanel" hidden>
  <div class="card hero">
    <div class="between"><h2 data-i18n="playTitle"></h2><button class="btn small ghost" id="plBack" type="button" data-i18n="plBack"></button></div>
    <div class="between"><b id="plLvl"></b><span class="hint" id="plStreak"></span></div>
    <div class="prog"><i id="plXpBar"></i></div>
    <div class="hint" id="plXp"></div>
  </div>
  <div class="card" id="plMenu">
    <div class="hint" id="plRes"></div>
    <button class="btn" type="button" data-game="mean" data-i18n="gMean"></button>
    <button class="btn" type="button" data-game="listen" data-i18n="gListen"></button>
    <button class="btn" type="button" data-game="speak" data-i18n="gSpeak"></button>
    <button class="btn" type="button" data-game="write" data-i18n="gWrite"></button>
    <button class="btn" type="button" data-game="build" data-i18n="gBuild"></button>
    <button class="btn" type="button" data-game="sprint" data-i18n="gSprint"></button>
    <button class="chip" type="button" id="fxTog" aria-pressed="true" data-i18n="fxTog"></button>
    <button class="btn" type="button" data-exam="open" data-i18n="exBtn"></button>
  </div>
  <div class="card" id="plGame" hidden>
    <div class="prog"><i id="plProg"></i></div>
    <div class="between"><span class="badge" id="plQ"></span><span class="badge" id="plScore"></span></div>
    <div id="plPrompt" style="text-align:center;font-family:var(--font-han);font-size:2.2rem;font-weight:900;min-height:56px"></div>
    <div id="plBuilt" lang="zh" style="text-align:center;font-family:var(--font-han);font-size:1.4rem;min-height:34px"></div>
    <div id="plOpts" class="list"></div>
    <button class="btn ghost small" id="plQuit" type="button" data-i18n="plQuit"></button>
  </div>
  <div class="card" id="exSetup" hidden>
    <h2 data-i18n="exTitle"></h2>
    <div class="hint" id="exHintT" data-i18n="exHint"></div>
    <div><div class="label" style="margin-bottom:8px" data-i18n="exKind"></div><div class="chips" id="exMode"></div></div>
    <div><div class="label" style="margin-bottom:8px" data-i18n="exLevel"></div><div class="chips" id="exLv"></div></div>
    <div><div class="label" style="margin-bottom:8px" data-i18n="exCount"></div><div class="chips" id="exN"></div></div>
    <div class="row"><button class="btn" type="button" data-exam="start" data-i18n="exStart"></button><button class="btn ghost" type="button" data-exam="menu" data-i18n="plBack"></button></div>
    <div id="exHist" class="hint"></div>
  </div>
  <div class="card" id="exRun" hidden>
    <div class="between"><span class="badge" id="exQ"></span><span class="badge" id="exT"></span></div>
    <div class="bar"><i id="exBar"></i></div>
    <div id="exPrompt" style="text-align:center;font-family:var(--font-han);font-size:2.2rem;font-weight:900;min-height:56px"></div>
    <div id="exOpts" class="list"></div>
    <button class="btn ghost small" type="button" data-exam="quit" data-i18n="plQuit"></button>
  </div>
  <div class="card" id="exDone" hidden></div>
</div>

<!-- HSK VOCAB -->
<div class="pane" id="p-hsk" role="tabpanel" hidden>
  <div class="card hero">
    <h2 data-i18n="hskTitle"></h2>
    <div class="between"><span class="hint" id="hskInfo"></span><span class="hint" id="hskCnt"></span></div>
    <div class="prog"><i id="hskProg"></i></div>
    <div class="chips" id="hskStd" role="group" aria-label="HSK 2.0 / 3.0"></div>
    <div class="chips" id="hskLv"></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="hskQ" type="search" data-i18n-ph="hskSearch" autocomplete="off" enterkeyhint="search"><button type="button" class="sx" data-clear="hskQ" aria-label="×" hidden>×</button><button type="button" class="sx" id="hwOpen" style="right:44px" aria-label="Draw">✍</button></div>
    <label class="chk"><input type="checkbox" id="hskOnly"><span data-i18n="hskOnly"></span></label>
    <div class="row" style="flex-wrap:wrap"><button class="chip" type="button" data-playq="#hskList" data-i18n="lsPlay"></button><button class="chip" type="button" data-slow="1" aria-pressed="false" data-i18n="lsSlow"></button></div>
  </div>
  <div id="hskList" class="list"></div>
</div>

<!-- GRAMMAR -->
<div class="pane" id="p-gram" role="tabpanel" hidden>
  <div class="card hero">
    <div class="between"><h2 data-i18n="gmTitle"></h2><button class="btn small ghost" id="gmAdd" type="button" hidden>+ Шинэ</button></div>
    <div class="hint" data-i18n="gmHint"></div>
    <div class="chips" id="gmLv"></div>
    <div class="chips"><button class="chip" id="gmConn" type="button" aria-pressed="false" data-i18n="gmConn"></button></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gmQ" type="search" data-i18n-ph="hskSearch" autocomplete="off" enterkeyhint="search"><button type="button" class="sx" data-clear="gmQ" aria-label="×" hidden>×</button></div>
    <div class="hint" id="gmCnt"></div>
  </div>
  <div id="gmList" class="list"></div>
</div>

<!-- MY LISTS -->
<div class="pane" id="p-list" role="tabpanel" hidden>
  <div class="card hero">
    <h2 data-i18n="lsTitle"></h2>
    <div class="chips" id="lsTabs" role="group"></div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn" id="lsPractice" type="button" data-i18n="lsPractice"></button>
      <button class="btn ghost" type="button" data-playq="#lsList" data-i18n="lsPlay"></button>
      <button class="chip" type="button" data-slow="1" aria-pressed="false" data-i18n="lsSlow"></button>
    </div>
  </div>
  <div id="lsList" class="list"></div>
</div>

<!-- CARDS -->
<div class="pane" id="p-cards" role="tabpanel" hidden>
  <div class="card">
    <div class="chips" id="modes" role="group" data-i18n-aria="modesLbl"></div>
    <div class="grid2">
      <label class="f" for="cLv"><span data-i18n="cLvLbl"></span><select id="cLv"></select></label>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <button class="chip" id="dirBtn" type="button" aria-pressed="false"></button>
        <button class="chip" id="shufBtn" type="button" aria-pressed="false" data-i18n="shuffle"></button>
      </div>
    </div>
  </div>
  <div id="deck" style="display:flex;flex-direction:column;gap:14px"></div>
</div>

<!-- GROUP -->
<div class="pane" id="p-group" role="tabpanel" hidden>
  <div id="gList" class="pane">
    <div class="card" id="tourCard" hidden></div>
    <div class="card">
      <h2 data-i18n="gTitle"></h2>
      <div class="chips" id="gLv"></div>
      <div class="chips" id="gSort"></div>
    </div>
    <div id="members" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
  <div id="gDetail" class="pane" hidden></div>
</div>

<!-- ME -->
<div class="pane" id="p-me" role="tabpanel" hidden>
  <div class="card" id="progCard" hidden>
    <h2 data-i18n="progTitle"></h2>
    <div id="progBars" class="progchart"></div>
    <div class="hint" id="progSum"></div>
  </div>
  <div class="card">
    <h2 data-i18n="accTitle"></h2>
    <div class="hint" data-i18n="accHint"></div>
    <div class="badge" id="acCur" style="align-self:flex-start;white-space:normal"></div>
    <label class="f" for="acMail"><span data-i18n="accEmail"></span><input id="acMail" type="text" inputmode="email" autocapitalize="none" autocomplete="email"></label>
    <button class="btn ghost" id="acMailBtn" type="button" data-i18n="accEmailBtn"></button>
    <label class="f" for="acPass"><span data-i18n="accPass"></span><input id="acPass" type="password" autocomplete="new-password"></label>
    <button class="btn ghost" id="acPassBtn" type="button" data-i18n="accPassBtn"></button>
  </div>
  <div class="card">
    <h2 data-i18n="meTitle"></h2>
    <label class="f" for="meNick"><span data-i18n="nick"></span><input id="meNick" type="text" maxlength="24"></label>
    <div><div class="label" style="margin-bottom:8px" data-i18n="level"></div><div class="chips" id="meLv"></div></div>
    <div class="grid2">
      <label class="f" for="meExam"><span data-i18n="examDate"></span><input id="meExam" type="date"></label>
      <label class="f" for="meMin"><span data-i18n="dailyTime"></span><select id="meMin"></select></label>
    </div>
    <div><div class="label" style="margin-bottom:8px" data-i18n="goalLbl"></div>
      <div class="chips" id="goals">
        <button class="chip" type="button" data-g="uni" aria-pressed="false" data-i18n="gUni"></button>
        <button class="chip" type="button" data-g="job" aria-pressed="false" data-i18n="gJob"></button>
        <button class="chip" type="button" data-g="skill" aria-pressed="false" data-i18n="gSkill"></button>
        <button class="chip" type="button" data-g="fast" aria-pressed="false" data-i18n="gFast"></button>
