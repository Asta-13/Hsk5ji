body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.6;

.banner b{display:block;font-size:.72rem;letter-spacing:.1em;opacity:.8;margin-bottom:2px}

.badge.warn{background:var(--seal);color:#fff}

.hero{display:flex;gap:16px;align-items:center}
.seal{flex:none;width:104px;height:104px;border-radius:12px;background:var(--seal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-3deg)}
.seal b{font-family:var(--font-display);font-size:2.8rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}

@keyframes pop{0%{transform:rotate(-3deg) scale(1)}35%{transform:rotate(4deg) scale(1.14)}100%{transform:rotate(-3deg) scale(1)}}
.hero h1{font-size:1.35rem;font-weight:900}

.task:has(input:checked){background:var(--accent-soft)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted)}

.cardx.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;overflow-y:auto}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.big{font-family:var(--font-han);font-size:4rem;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.big.mn{font-family:var(--font-display);font-size:1.7rem}
.pin{font-size:1.4rem;color:var(--accent);font-weight:500}
.mean{font-size:1.25rem;font-weight:700;overflow-wrap:anywhere}
.ex{font-family:var(--font-han);font-size:.95rem;color:var(--muted)}
.tap{font-size:.75rem;color:var(--muted);position:absolute;bottom:12px}
.spk{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer}
.spk svg{width:20px;height:20px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.answers .btn{background:var(--surface);border:2px solid var(--line);color:var(--fg)}
.answers .no{border-color:var(--bad);color:var(--bad)}
.answers .yes{border-color:var(--ok);color:var(--ok)}
.answers[aria-disabled="true"]{opacity:.45;pointer-events:none}
.sum{align-items:center;text-align:center;padding:28px 16px}
.sum b{font-family:var(--font-display);font-size:2.2rem}

.mem{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;color:var(--fg);width:100%}
.mem .rk{font-family:var(--font-display);font-weight:900;font-size:1.3rem;color:var(--muted);min-width:1.6em;text-align:center}
.mem.me{border-color:var(--accent);background:var(--accent-soft)}
.mem .nm{font-weight:700;overflow-wrap:anywhere;min-width:0}
.mem .sm{font-size:.78rem;color:var(--muted)}
.mem .num{font-family:var(--font-display);font-weight:900;font-size:1.4rem;font-variant-numeric:tabular-nums;text-align:right;line-height:1.1}
.mem .num small{display:block;font-family:var(--font-body);font-weight:400;font-size:.68rem;color:var(--muted)}
.adm{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.adm .nm{font-weight:700;overflow-wrap:anywhere}

.tl{gap:0}
.tl li{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl .d{font-variant-numeric:tabular-nums;font-size:.82rem;color:var(--muted);font-weight:700}
.tl b{display:block}
.tl small{color:var(--muted)}
.tl li.now{background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:10px;border-top-color:transparent}
.tl li.now .d{color:var(--accent)}
.tl li.done .d,.tl li.done b{color:var(--muted)}
.tl li.exam .d,.tl li.exam b{color:var(--seal)}
.rev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rev div{border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;min-width:0}
.rev strong{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.rev span{font-size:.75rem;color:var(--muted)}
.note{font-size:.9rem;background:var(--accent-soft);border-radius:10px;padding:12px 14px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
.tabs div{max-width:720px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.tab{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:.66rem;font-weight:700;cursor:pointer;min-height:52px;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"],.tab.on{color:var(--accent);background:var(--accent-soft)}

.tab.mi{flex-direction:column;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;gap:4px;min-height:92px;color:var(--fg);font-size:.95rem}
.tab.mi small{font-weight:500;font-size:.74rem;color:var(--muted);text-align:left;line-height:1.3}
.tab.mi svg{color:var(--accent)}
.tab.mi[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.msheet{position:fixed;inset:0;z-index:20}
.msheet[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:mfade .2s}
.mpanel{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:mup .22s ease-out}
.mgrip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mgrid .tab.mi:last-child:nth-child(odd){grid-column:1/-1}
@keyframes mup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.rcnt{font-size:.8rem;color:var(--muted);font-weight:700}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg .chip{font-size:.8rem;padding:4px 10px}
.search input[type=search]{transition:box-shadow .15s,border-color .15s}
.search input[type=search]:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stick{position:sticky;top:0;z-index:4;background:var(--surface)}
.empty b{display:block;margin-bottom:4px}
.tab:disabled{opacity:.4}
.tab[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){.hero{flex-direction:column;align-items:flex-start}.tl li{grid-template-columns:1fr;gap:2px}.grid2{grid-template-columns:1fr}.big{font-size:3.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

input[type=search]{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 38px;min-width:0;width:100%;-webkit-appearance:none;appearance:none}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:12px;width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.sx{position:absolute;right:4px;background:none;border:0;color:var(--muted);font-size:1.5rem;width:40px;height:40px;cursor:pointer}
mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px;font-weight:700}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--seal));transition:width .4s}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%)}
.list{display:flex;flex-direction:column;gap:8px}
.list .w{background:var(--surface);animation:fi .25s ease both}
.list .gm{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;background:var(--surface);animation:fi .25s ease both}
.list .gm .z{font-family:var(--font-han);font-size:1.05rem}
.chk{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.pop{animation:pop .45s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.3);background:var(--ok);color:#fff}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal[hidden]{display:none}
.modal .card{max-width:340px;width:100%;max-height:92vh;overflow:auto}
#wrBox{width:260px;height:260px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none}
#hskQ{padding-right:88px}
#hwCv{width:280px;height:280px;max-width:100%;margin:0 auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:none}
.w{grid-template-columns:auto minmax(0,1fr) auto}
.w>*{min-width:0}
.w .h{overflow-wrap:anywhere}
.w .m,.w .p,.gm .m,.gm .z,.gm .hint{display:inline-block;max-width:100%;overflow-wrap:anywhere;word-break:break-word}
.list .w>span:last-child{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:104px}
.gm{overflow-wrap:anywhere;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<div class="langbar"><select id="lang" aria-label="Language"><option value="mn">Монгол</option><option value="en">English</option><option value="ru">Русский</option><option value="ja">日本語</option></select></div>

<!-- TODAY -->
<div class="pane" id="p-today" role="tabpanel">
  <div class="banner" id="notice" hidden><b data-i18n="noticeLbl"></b><span id="noticeTx"></span></div>
  <div class="card hero" id="dayCard" hidden>
    <div class="between"><span class="badge" data-i18n="dayWord"></span><button class="btn small" type="button" data-goplay="1" data-i18n="plGoBtn"></button></div>
    <div id="dayBody"></div>
  </div>
  <div class="card" id="taskCard" hidden></div>

  <div class="card" id="auth" hidden>
    <h2 data-i18n="authTitle"></h2>
    <div class="hint" data-i18n="authHint"></div>
    <label class="f" for="auUser"><span data-i18n="loginName"></span><input id="auUser" type="text" inputmode="email" autocapitalize="none" autocorrect="off" autocomplete="username" maxlength="60"></label>
    <label class="f" for="auPass"><span data-i18n="password"></span><input id="auPass" type="password" autocomplete="current-password"></label>
    <div class="row"><button class="btn" id="auIn" type="button" data-i18n="signIn"></button><button class="btn ghost" id="auUp" type="button" data-i18n="signUp"></button></div>
    <button class="btn ghost small" id="auForgot" type="button" style="align-self:flex-start" data-i18n="forgot"></button>
    <div class="hint" data-i18n="authNote"></div>
  </div>
  <div class="card hero" id="recov" hidden>
    <h2 data-i18n="resetTitle"></h2>
    <label class="f" for="rcPass"><span data-i18n="accPass"></span><input id="rcPass" type="password" autocomplete="new-password"></label>
    <button class="btn" id="rcSave" type="button" data-i18n="resetSave"></button>
  </div>
  <div class="card" id="onb" hidden>
    <h2 data-i18n="obTitle"></h2>
    <div class="hint" data-i18n="obHint"></div>
    <label class="f" for="obNick"><span data-i18n="nick"></span><input id="obNick" type="text" maxlength="24" data-i18n-ph="obNickPh"></label>
    <div><div class="label" style="margin-bottom:8px" data-i18n="level"></div><div class="chips" id="obLv"></div></div>
    <div class="grid2">
      <label class="f" for="obExam"><span data-i18n="examDate"></span><input id="obExam" type="date"></label>
      <label class="f" for="obMin"><span data-i18n="dailyTime"></span><select id="obMin"></select></label>
    </div>
    <button class="btn" id="obSave" type="button" data-i18n="start"></button>
    <div class="hint" id="obNote"></div>
  </div>

  <div class="card" id="heroCard">
    <div class="hero">
      <div class="seal" id="seal"><span data-i18n="sealA"></span><b id="days">—</b><span data-i18n="sealB"></span></div>
      <div>
        <div class="label" id="examLbl"></div>
        <h1 id="lvTitle"></h1>
        <div class="muted" id="sub" style="font-size:.9rem"></div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="stToday">0</b><span data-i18n="stToday"></span></div>
      <div class="stat"><b id="stTotal">0</b><span data-i18n="stTotal"></span></div>
      <div class="stat"><b id="stStreak">0</b><span data-i18n="stStreak"></span></div>
    </div>
    <div>
      <div class="between"><span class="hint" data-i18n="lvProgLbl"></span><span class="hint" id="lvProgTx"></span></div>
      <div class="bar" style="margin-top:4px"><i id="lvProg"></i></div>
    </div>
  </div>

  <div class="card">
    <div class="label" data-i18n="phaseLbl"></div>
    <div class="phase-now" id="phaseNow"></div>
  </div>

  <div class="card">
    <div class="between"><h2 data-i18n="todayPlan"></h2><span class="label" id="todayLabel"></span></div>
    <div class="prog">
      <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="26"/><circle class="fg" id="ringFg" cx="32" cy="32" r="26" stroke-dasharray="163.4" stroke-dashoffset="163.4"/><text x="32" y="33" id="ringTx">0%</text></svg>
      <div><b id="doneTxt"></b><div class="hint" id="doneMsg"></div></div>
    </div>
    <ul id="tasks"></ul>
    <button class="btn ghost small" id="reset" type="button" style="align-self:flex-start" data-i18n="resetChecks"></button>
  </div>
</div>

<!-- WORDS -->
<div class="pane" id="p-words" role="tabpanel" hidden>
  <div class="card">
    <h2 data-i18n="wTitle"></h2>
    <form id="addForm" autocomplete="off" style="display:flex;flex-direction:column;gap:10px">
      <div class="grid2">
        <label class="f" for="fH"><span data-i18n="fHan"></span><input class="han" id="fH" type="text" lang="zh" placeholder="例如：参加"></label>
        <label class="f" for="fP"><span data-i18n="fPin"></span><input id="fP" type="text" placeholder="can1jia1 → cānjiā"></label>
      </div>
      <div id="fInfo" class="hint" aria-live="polite" style="display:flex;flex-direction:column;gap:6px"></div>
      <label class="f" for="fM"><span data-i18n="fMean"></span><input id="fM" type="text" data-i18n-ph="fMeanPh"></label>
      <label class="f" for="fE"><span data-i18n="fEx"></span><input id="fE" type="text" lang="zh" placeholder="我想参加比赛。"></label>
      <div class="grid2">
        <label class="f" for="fL"><span data-i18n="level"></span><select id="fL"></select></label>
        <label class="f" for="fD"><span data-i18n="fDate"></span><input id="fD" type="date"></label>
      </div>
      <button class="btn" type="submit" data-i18n="addBtn"></button>
      <div class="hint" data-i18n-html="pinHint"></div>
    </form>
  </div>
  <div class="card">
    <details>
      <summary data-i18n="bulkSum"></summary>
      <div style="display:flex;flex-direction:column;gap:10px;padding-top:6px">
        <div class="hint" data-i18n-html="bulkHint"></div>
        <textarea id="bulk" data-i18n-aria="bulkAria" data-i18n-ph="bulkPh" lang="zh"></textarea>
        <button class="btn" id="bulkBtn" type="button" data-i18n="bulkBtn"></button>
      </div>
    </details>
  </div>
  <div class="card">
    <div class="between"><h2 data-i18n="myWords"></h2><span class="hint" id="storeNote"></span></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="wlQ" type="search" data-i18n-ph="hskSearch" autocomplete="off" enterkeyhint="search"><button type="button" class="sx" data-clear="wlQ" aria-label="×" hidden>×</button></div>
    <div class="chips" id="wlLv"></div>
    <div id="wordList" style="display:flex;flex-direction:column;gap:16px"></div>
  </div>
</div>

<!-- PLAY -->
<div class="pane" id="p-play" role="tabpanel" hidden>
  <div class="card hero">
    <div class="between"><h2 data-i18n="playTitle"></h2><button class="btn small ghost" id="plBack" type="button" data-i18n="plBack"></button></div>
    <div class="between"><b id="plLvl"></b><span class="hint" id="plStreak"></span></div>
    <div class="prog"><i id="plXpBar"></i></div>
    <div class="hint" id="plXp"></div>
  </div>
  <div class="card" id="plMenu">
    <div class="hint" id="plRes"></div>
    <button class="btn" type="button" data-game="mean" data-i18n="gMean"></button>
    <button class="btn" type="button" data-game="listen" data-i18n="gListen"></button>
    <button class="btn" type="button" data-game="build" data-i18n="gBuild"></button>
    <button class="btn" type="button" data-exam="open" data-i18n="exBtn"></button>
  </div>
  <div class="card" id="plGame" hidden>
    <div class="between"><span class="badge" id="plQ"></span><span class="badge" id="plScore"></span></div>
    <div id="plPrompt" style="text-align:center;font-family:var(--font-han);font-size:2.2rem;font-weight:900;min-height:56px"></div>
    <div id="plBuilt" lang="zh" style="text-align:center;font-family:var(--font-han);font-size:1.4rem;min-height:34px"></div>
    <div id="plOpts" class="list"></div>
    <button class="btn ghost small" id="plQuit" type="button" data-i18n="plQuit"></button>
  </div>
  <div class="card" id="exSetup" hidden>
    <h2 data-i18n="exTitle"></h2>
    <div class="hint" data-i18n="exHint"></div>
    <div><div class="label" style="margin-bottom:8px" data-i18n="exLevel"></div><div class="chips" id="exLv"></div></div>
    <div><div class="label" style="margin-bottom:8px" data-i18n="exCount"></div><div class="chips" id="exN"></div></div>
    <div class="row"><button class="btn" type="button" data-exam="start" data-i18n="exStart"></button><button class="btn ghost" type="button" data-exam="menu" data-i18n="plBack"></button></div>
    <div id="exHist" class="hint"></div>
  </div>
  <div class="card" id="exRun" hidden>
    <div class="between"><span class="badge" id="exQ"></span><span class="badge" id="exT"></span></div>
    <div class="bar"><i id="exBar"></i></div>
    <div id="exPrompt" style="text-align:center;font-family:var(--font-han);font-size:2.2rem;font-weight:900;min-height:56px"></div>
    <div id="exOpts" class="list"></div>
    <button class="btn ghost small" type="button" data-exam="quit" data-i18n="plQuit"></button>
  </div>
  <div class="card" id="exDone" hidden></div>
</div>

<!-- HSK VOCAB -->
<div class="pane" id="p-hsk" role="tabpanel" hidden>
  <div class="card hero">
    <h2 data-i18n="hskTitle"></h2>
    <div class="between"><span class="hint" id="hskInfo"></span><span class="hint" id="hskCnt"></span></div>
    <div class="prog"><i id="hskProg"></i></div>
    <div class="chips" id="hskStd" role="group" aria-label="HSK 2.0 / 3.0"></div>
    <div class="chips" id="hskLv"></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="hskQ" type="search" data-i18n-ph="hskSearch" autocomplete="off" enterkeyhint="search"><button type="button" class="sx" data-clear="hskQ" aria-label="×" hidden>×</button><button type="button" class="sx" id="hwOpen" style="right:44px" aria-label="Draw">✍</button></div>
    <label class="chk"><input type="checkbox" id="hskOnly"><span data-i18n="hskOnly"></span></label>
  </div>
  <div id="hskList" class="list"></div>
</div>

<!-- GRAMMAR -->
<div class="pane" id="p-gram" role="tabpanel" hidden>
  <div class="card hero">
    <div class="between"><h2 data-i18n="gmTitle"></h2><button class="btn small ghost" id="gmAdd" type="button" hidden>+ Шинэ</button></div>
    <div class="hint" data-i18n="gmHint"></div>
    <div class="chips" id="gmLv"></div>
    <div class="chips"><button class="chip" id="gmConn" type="button" aria-pressed="false" data-i18n="gmConn"></button></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="gmQ" type="search" data-i18n-ph="hskSearch" autocomplete="off" enterkeyhint="search"><button type="button" class="sx" data-clear="gmQ" aria-label="×" hidden>×</button></div>
    <div class="hint" id="gmCnt"></div>
  </div>
  <div id="gmList" class="list"></div>
</div>

<!-- CARDS -->
<div class="pane" id="p-cards" role="tabpanel" hidden>
  <div class="card">
    <div class="chips" id="modes" role="group" data-i18n-aria="modesLbl"></div>
    <div class="grid2">
      <label class="f" for="cLv"><span data-i18n="cLvLbl"></span><select id="cLv"></select></label>
      <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
        <button class="chip" id="dirBtn" type="button" aria-pressed="false"></button>
        <button class="chip" id="shufBtn" type="button" aria-pressed="false" data-i18n="shuffle"></button>
      </div>
    </div>
  </div>
  <div id="deck" style="display:flex;flex-direction:column;gap:14px"></div>

    advUni:["Их сургуульд орох бол бичих, унших хэсэгт илүү цаг гарга. Тэтгэлгийн босго сургууль бүрт өөр байдаг тул хүсэж буй сургуулийнхаа журмаас шаардлагатай оноог шалга.","For university admission, spend more time on writing and reading. Scholarship thresholds differ by school, so check the required score in your target school's rules.","Для поступления уделите больше времени письму и чтению. Проходные баллы на стипендию у каждого вуза свои, проверьте их в правилах нужного вуза.","大学進学が目的なら、作文と読解の時間を増やしましょう。奨学金の基準点は大学ごとに違うので、志望校の募集要項で確認してください。"],
    advJob:["Ажилдаа хэрэглэх бол сонсголд арай их цаг гаргаж, ажил хэргийн үгсийг өдөр бүрийн үгэндээ нэм.","For work, give listening a bit more time and add business vocabulary to your daily words.","Для работы уделите чуть больше времени аудированию и добавляйте деловую лексику в ежедневные слова.","仕事で使うなら、リスニングの時間を少し増やし、ビジネス語彙を毎日の単語に混ぜましょう。"],
    advSkill:["Ярианы чадвараа ахиулах бол бичсэн өгүүлбэрээ чангаар унш.","To improve speaking, read your written sentences aloud.","Чтобы улучшить разговорную речь, читайте написанные предложения вслух.","会話力を伸ばすには、書いた文を声に出して読みましょう。"],
    advFast:["Хамгийн хурдан тэнцэх бол 3-р үеэс хойших сорилын шалгалтыг эрт эхлүүлж, сул талдаа цагаа төвлөрүүл.","To pass fastest, start mock exams earlier and focus your time on weak areas.","Чтобы сдать быстрее, раньше начните пробные экзамены и сосредоточьтесь на слабых местах.","最短で合格するなら、模擬試験を前倒しして苦手分野に時間を集中させましょう。"],
    advHigh:["Өмнөх түвшний оноо өндөр байна. Үгийн үеийг богиносгоод сорилын шалгалт руу эрт орж болно.","Your previous score is high. You can shorten the vocabulary phase and move to mock exams earlier.","Прошлый балл высокий. Можно сократить этап слов и раньше перейти к пробным экзаменам.","前の級のスコアが高いので、単語フェーズを短くして早めに模擬試験へ進めます。"],
    advMid:["Өмнөх түвшний суурь сайн байна. Төлөвлөгөөгөө дагаад яв.","Your base is solid. Follow the plan as it is.","База хорошая. Следуйте плану.","土台は十分です。計画どおりに進めましょう。"],

  function toneMark(s){
    return s.replace(/([a-züv:]+)([1-5])/gi,function(m,syl,t){
      t=+t;syl=syl.replace(/u:|v/gi,'ü').toLowerCase();if(t===5)return syl;
      var TT={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ'},i=-1;
      if(syl.indexOf('a')>-1)i=syl.indexOf('a');else if(syl.indexOf('e')>-1)i=syl.indexOf('e');
      else if(syl.indexOf('ou')>-1)i=syl.indexOf('o');
      else{var mm=syl.match(/[iouü](?![\s\S]*[iouü])/);i=mm?mm.index:-1}
      if(i<0)return syl;return syl.slice(0,i)+TT[syl[i]][t-1]+syl.slice(i+1);
    });
  }

    $('gList').hidden=false;$('gDetail').hidden=true;
    lvChips('gLv',G.lv,true);
    $('gSort').innerHTML=[['week','sWeek'],['xp','sXp'],['words','sWords'],['streak','sStreak']].map(function(s){return '<button class="chip" type="button" data-s="'+s[0]+'" aria-pressed="'+(G.sort===s[0])+'">'+T(s[1])+'</button>'}).join('');
    var L=members();
    if(!L.length){$('members').innerHTML='<div class="empty">'+T(mode==='db'?'gEmptyDb':'gEmptyLocal')+'</div>';return}
    $('members').innerHTML=L.map(function(m,i){
      var big=G.sort==='week'?m.week:G.sort==='words'?m.wc:G.sort==='xp'?m.xp:m.streak,cap=T(G.sort==='week'?'capWeek':G.sort==='words'?'capAll':G.sort==='xp'?'capXp':'capDays');
      return '<button class="mem'+(m.id===uid?' me':'')+'" type="button" data-u="'+esc(m.id)+'"><span class="rk">'+(i+1)+'</span><span><span class="nm">'+esc(m.p.nick)+(m.id===uid?' '+T('meTag'):'')+'</span> <span class="badge">HSK '+(m.p.level||'?')+'</span>'+(CFG.hidden[m.id]?' <span class="badge warn">'+T('hiddenTag')+'</span>':'')+
        '<br><span class="sm">'+esc(T('memSm',{w:m.wc,s:m.streak,a:ago(m.p.last)}))+'</span></span><span class="num">'+big+'<small>'+cap+'</small></span></button>';

  $('gLv').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(!b)return;G.lv=+b.dataset.l;renderGroup()});
  $('gSort').addEventListener('click',function(e){var b=e.target.closest('[data-s]');if(!b)return;G.sort=b.dataset.s;renderGroup()});
  $('members').addEventListener('click',function(e){var b=e.target.closest('[data-u]');if(b)openMember(b.dataset.u)});
  async function openMember(id){
    G.view={id:id,lv:0,data:null,loading:true};renderGroup();
    var data={};
    try{
      if(sb){var ws=await fetchAll(function(){return sb.from('words').select('*').eq('uid',id).order('id')});
        ws.forEach(function(w){(data[w.l]=data[w.l]||{})[w.id]={id:w.id,h:w.h,p:w.p||'',m:w.m,e:w.e||'',d:w.d}})}
    }catch(e){}
    if(G.view&&G.view.id===id){G.view.data=data;G.view.loading=false;var first=Object.keys(data).sort()[0];G.view.lv=first?+first:0;renderGroup()}
  }
  function renderDetail(){
    var v=G.view,p=P[v.id]||{};
    $('gList').hidden=true;$('gDetail').hidden=false;
    var h='<div class="card"><div class="row"><button class="btn ghost small" id="gBack" type="button">'+T('back')+'</button></div><div><h2>'+esc(p.nick||T('member'))+' <span class="badge">HSK '+(p.level||'?')+'</span></h2>'+
      '<div class="hint">'+esc(T('detSub',{w:p.wc||0,s:streakOf(p.act),a:ago(p.last)}))+(p.exam?esc(T('examShort',{d:p.exam})):'')+'</div></div>';
    if(v.loading)h+='<div class="hint">'+T('loading')+'</div></div>';
    else{
      var ks=Object.keys(v.data||{}).sort();
      if(!ks.length)h+='<div class="empty">'+T('noMemberWords')+'</div></div>';
      else{
        h+='<div class="chips">'+ks.map(function(k){return '<button class="chip" type="button" data-vl="'+k+'" aria-pressed="'+(v.lv===+k)+'">HSK '+k+'<small>'+Object.keys(v.data[k]).length+'</small></button>'}).join('')+'</div>';
        h+='<button class="btn small" id="gCopyAll" type="button" style="align-self:flex-start">'+T('copyAll')+'</button></div>';
        var ws=v.data[v.lv]||{};
        h+='<div style="display:flex;flex-direction:column;gap:8px">'+Object.keys(ws).map(function(k){var w=ws[k],on=has(w,v.lv);
          return '<div class="w"><span class="h" lang="zh">'+esc(w.h)+'</span><span><span class="p">'+esc(w.p)+'</span><br><span class="m">'+esc(w.m)+'</span></span><button class="x add'+(on?' added':'')+'" type="button" data-cp="'+esc(k)+'">'+T(on?'copied':'copy')+'</button></div>'}).join('')+'</div>';
      }
    }
    $('gDetail').innerHTML=h;
  }
  function has(w,l){return wordsArr().some(function(x){return x.l===l&&x.h===w.h})}
  function copyWord(w,l){if(has(w,l)||!w.h||!w.m)return false;addWord(String(w.h).slice(0,40),String(w.p||''),String(w.m).slice(0,120),String(w.e||'').slice(0,200),TODAY,l);return true}
  $('gDetail').addEventListener('click',function(e){
    var v=G.view;if(!v)return;
    if(e.target.closest('#gBack')){G.view=null;renderGroup();return}
    var c=e.target.closest('[data-vl]');if(c){v.lv=+c.dataset.vl;renderDetail();return}
    var cp=e.target.closest('[data-cp]');
    if(cp&&hasProfile()){var w=(v.data[v.lv]||{})[cp.dataset.cp];if(w&&copyWord(w,v.lv)){syncSummary(TODAY);toast(T('tCopied'));renderAll();renderDetail()}return}
    if(e.target.closest('#gCopyAll')&&hasProfile()){var n=0,ws=v.data[v.lv]||{};Object.keys(ws).forEach(function(k){if(copyWord(ws[k],v.lv))n++});if(n)syncSummary(TODAY);toast(T('tCopiedN',{n:n}));renderAll();renderDetail()}
  });

  /* ---------- me / plan ---------- */
  var meLevel=5;
  function advise(){
    var parts=[],g=S.profile.goal,n=parseInt(S.profile.s4,10),A={uni:'advUni',job:'advJob',skill:'advSkill',fast:'advFast'};
    if(g&&A[g])parts.push(T(A[g]));
    if(!isNaN(n))parts.push(T(n>=240?'advHigh':(n>=200?'advMid':'advLow')));
    $('advice').textContent=parts.length?parts.join(' '):T('advNone');
  }
  function renderMe(){
    var p=S.profile;
    $('acct').hidden=!(sb&&uid);$('acctName').textContent=T('acctLogin',{n:loginName});$('myId').textContent=uid||'';
    if(document.activeElement!==$('meNick'))$('meNick').value=p.nick||'';
    meLevel=p.level||5;lvChips('meLv',meLevel,false);
    $('meExam').value=p.exam||'';$('meMin').value=String(p.dailyMin||DEFMIN[meLevel]);
    if(document.activeElement!==$('meS'))$('meS').value=p.s4||'';
    document.querySelectorAll('#goals .chip').forEach(function(c){c.setAttribute('aria-pressed',c.dataset.g===p.goal?'true':'false')});
    advise();
    var ps=phasesFor(),idx=-1;ps.forEach(function(x,i){if(today>=x.a&&today<=x.b)idx=i});
    $('tl').innerHTML=ps.length?ps.map(function(x,i){
      var cls=i===idx?'now':(x.b<today?'done':'');if(x.exam)cls+=' exam';
      return '<li class="'+cls+'"><span class="d">'+(x.exam?fmt(x.a):fmt(x.a)+' – '+fmt(x.b))+'</span><span><b>'+esc(phTitle(x))+'</b><small>'+esc(phSub(x))+'</small></span></li>';
    }).join(''):'<li><span class="muted">'+T('roadNone')+'</span></li>';
    $('rev').innerHTML=[['revTomorrow',1],['rev3',3],['rev7',7]].map(function(r){return '<div><span>'+T(r[0])+'</span><strong>'+fmt(plus(today,r[1]))+'</strong></div>'}).join('');
  }
  $('meLv').addEventListener('click',function(e){var b=e.target.closest('[data-l]');if(!b)return;meLevel=+b.dataset.l;lvChips('meLv',meLevel,false);$('meMin').value=String(DEFMIN[meLevel])});
  document.querySelectorAll('#goals .chip').forEach(function(c){c.addEventListener('click',function(){pPatch({goal:c.dataset.g});renderMe()})});
  $('meSave').addEventListener('click',function(){
    var nick=$('meNick').value.trim();if(!nick){toast(T('tNeedNick'));return}
    pPatch({nick:nick,level:meLevel,exam:$('meExam').value||'',dailyMin:+$('meMin').value,s4:$('meS').value});
    renderAll();renderTasks();toast(T('tSaved'));
  });
  $('meRestart').addEventListener('click',function(){pPatch({start:TODAY});renderAll();toast(T('tRestart'))});

  /* ---------- admin ---------- */
  var sureDel=null;
  function renderAdmin(){
    if(!isOwner)return;
    var L=Object.keys(P).map(function(k){return {id:k,p:P[k]}});
    $('aMem').textContent=L.length;
    $('aAct').textContent=L.filter(function(m){return weekWords(m.p.act)>0||(m.p.last&&Math.round((today-parseIso(m.p.last))/86400000)<=7)}).length;
    $('aWords').textContent=L.reduce(function(s,m){return s+(m.p.wc||0)},0);
    if(document.activeElement!==$('aNotice'))$('aNotice').value=CFG.notice||'';
    $('aList').innerHTML=L.length?L.sort(function(a,b){return (b.p.last||'')<(a.p.last||'')?-1:1}).map(function(m){
      var hid=!!CFG.hidden[m.id];
      return '<div class="adm"><div class="between"><span class="nm">'+esc(m.p.nick||T('noName'))+(m.id===uid?' '+T('adminTag'):'')+'</span><span class="badge">HSK '+(m.p.level||'?')+'</span></div>'+
        '<div class="hint">'+esc(T('admInfo',{w:m.p.wc||0,a:ago(m.p.last)}))+(m.p.exam?esc(T('examShort',{d:m.p.exam})):'')+(hid?esc(T('hiddenSuffix')):'')+'</div>'+
        '<div class="row"><input type="text" data-nick="'+esc(m.id)+'" value="'+esc(m.p.nick||'')+'" maxlength="24" aria-label="'+esc(T('nameLbl'))+'" style="flex:1;min-width:120px"><button class="btn ghost small" data-rn="'+esc(m.id)+'" type="button">'+T('rename')+'</button></div>'+
        '<div class="row"><button class="btn ghost small" data-vw="'+esc(m.id)+'" type="button">'+T('viewWords')+'</button><button class="btn ghost small" data-hd="'+esc(m.id)+'" type="button">'+T(hid?'show':'hide')+'</button>'+
        (m.id!==uid?'<button class="btn small'+(sureDel===m.id?' danger':' ghost')+'" data-rm="'+esc(m.id)+'" type="button">'+T(sureDel===m.id?'removeSure':'removeAcc')+'</button>':'')+'</div></div>';
    }).join(''):'<div class="empty">'+T('admEmpty')+'</div>';
  }
  function saveNotice(){var n=CFG.notice;if(sb)q(async function(){var x=await sb.from('site').upsert({id:'cfg',notice:n});if(x.error)throw x.error})}
  $('aNoticeSave').addEventListener('click',function(){CFG.notice=$('aNotice').value.trim();saveNotice();renderToday();toast(T('tNoticeSaved'))});
  $('aList').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b||!sb)return;
    if(b.dataset.rn){var id=b.dataset.rn,inp=document.querySelector('[data-nick="'+id+'"]'),nm=inp.value.trim();if(!nm)return;
      if(P[id])P[id].nick=nm;var d=Object.assign({},P[id]);
      q(async function(){var x=await sb.from('profiles').update({nick:nm,data:d}).eq('id',id);if(x.error)throw x.error});toast(T('tRenamed'));renderAdmin()}
    else if(b.dataset.hd){var id2=b.dataset.hd,h=!CFG.hidden[id2];if(h)CFG.hidden[id2]=1;else delete CFG.hidden[id2];
      q(async function(){var x=await sb.from('profiles').update({hidden:h}).eq('id',id2);if(x.error)throw x.error});renderAdmin();renderGroup()}
    else if(b.dataset.vw){showTab('group');openMember(b.dataset.vw)}
    else if(b.dataset.rm){
      var id3=b.dataset.rm;
      if(sureDel===id3){sureDel=null;
        q(async function(){var x=await sb.from('words').delete().eq('uid',id3);if(x.error)throw x.error;x=await sb.from('profiles').delete().eq('id',id3);if(x.error)throw x.error});
        delete P[id3];toast(T('tAccDeleted'));renderAdmin()}
      else{sureDel=id3;renderAdmin();setTimeout(function(){if(sureDel===id3){sureDel=null;renderAdmin()}},3500)}
    }
  });
  function csv(rows){return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n')}
  function save(name,data){
    try{var bl=new Blob([data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);toast(T('tFileSaved'))}catch(e){toast(T('tFileErr'))}
  }

    }catch(e){toast(T('tCollectErr'))}

      if(a==='again'){exOpen();return}
      if(a==='retry'&&EX){var ws=EX.qs.filter(function(q){return !exRight(q)}).map(function(q){return q.w});exSel.lv=EX.lv;exStart(ws);return}
      if(a==='addwrong'&&EX){exAdd(EX.qs.filter(function(q){return !exRight(q)}).map(function(q){return q.w}));exResult(Math.round(EX.ok*100/EX.qs.length),EX.ok*5);return}
    }
    b=e.target.closest('[data-exlv]');if(b){exSel.lv=+b.dataset.exlv;exSetup();return}
    b=e.target.closest('[data-exn]');if(b){exSel.n=+b.dataset.exn;exSetup();return}
    b=e.target.closest('[data-exadd]');
    if(b&&EX){var w=EX.qs.filter(function(q){return q.w.h===b.dataset.exadd})[0];if(w){exAdd([w.w]);b.textContent='✓';b.disabled=true;b.classList.add('added')}return}
    b=e.target.closest('[data-exopt]');
    if(b&&EX&&EX.running&&!EX.lock){
      EX.lock=1;EX.qs[EX.i].pick=+b.dataset.exopt;b.style.background='var(--accent)';b.style.color='var(--on-accent)';
      setTimeout(function(){if(!EX)return;EX.lock=0;EX.i++;if(EX.i>=EX.qs.length)exFinish();else exRender()},250);
    }
  });
  /* ---------- stroke order / writing practice (HanziWriter, loaded on demand) ---------- */
  var WR=null,wrChars=[];
  function loadHW(cb){
    if(window.HanziWriter){cb();return}
    var sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js';
    sc.onload=cb;sc.onerror=function(){toast(T('wrErr'))};document.head.appendChild(sc);
  }
  function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888'}
  function openWriter(t){
    wrChars=Array.from(t).filter(function(c){return /[\u4e00-\u9fff]/.test(c)});
    if(!wrChars.length)return;
    $('wrModal').hidden=false;loadHW(function(){showChar(0)});
  }
  function showChar(i){
    $('wrChips').innerHTML=wrChars.length>1?wrChars.map(function(c,k){return '<button class="btn small'+(k===i?'':' ghost')+'" type="button" data-wrc="'+k+'" lang="zh">'+esc(c)+'</button>'}).join(''):'';
    $('wrBox').innerHTML='';$('wrMsg').textContent='';
    WR=HanziWriter.create('wrBox',wrChars[i],{width:260,height:260,padding:14,showOutline:true,strokeColor:cssv('--fg'),outlineColor:cssv('--line'),radicalColor:cssv('--seal'),highlightColor:cssv('--accent'),strokeAnimationSpeed:1,delayBetweenStrokes:250,onLoadCharDataError:function(){$('wrMsg').textContent=T('wrErr')}});
    WR.animateCharacter();WR.cur=i;
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-write]');if(b){openWriter(b.dataset.write);return}
    if(e.target.id==='wrModal'||e.target.closest('#wrClose')){$('wrModal').hidden=true;WR=null;return}
    b=e.target.closest('[data-wrc]');if(b){showChar(+b.dataset.wrc);return}
    if(!WR)return;
    if(e.target.closest('#wrAnim')){WR.cancelQuiz();WR.animateCharacter();return}
    if(e.target.closest('#wrQuiz')){
      $('wrMsg').textContent=T('wrHint');
      WR.quiz({onComplete:function(){
        $('wrMsg').textContent=T('wrDone');if(hasProfile())addXp(5);
        var n=WR.cur+1;if(n<wrChars.length)setTimeout(function(){if(WR)showChar(n)},900);
      }});
    }
  });
  /* ---------- classes & tasks (admin = teacher) ---------- */
  var CL={classes:[],members:[],tasks:[],done:[]},clOpen={};
  function renderClasses(){
    var el=$('clsAdmin');if(!el)return;if(!isOwner){el.hidden=true;return}el.hidden=false;
    var h='<h2>'+T('clsTitle')+'</h2><div class="row"><input id="clName" type="text" placeholder="'+esc(T('clName'))+'"><button class="btn" id="clAdd" type="button">+</button></div>';
    CL.classes.forEach(function(c){
      var mem=CL.members.filter(function(m){return m.class_id===c.id});
      h+='<div class="gm"><div class="between"><b>'+esc(c.name)+'</b><span class="badge">'+T('clCode')+': '+esc(c.code)+'</span></div><button class="btn ghost small" type="button" data-cmem="'+esc(c.id)+'">👥 '+mem.length+' '+T('clStud')+'</button>';
      if(clOpen[c.id])mem.forEach(function(m){
        var pp=P[m.uid]||{},dn=CL.tasks.filter(function(t){return t.class_id===c.id&&CL.done.some(function(x){return x.task_id===t.id&&x.uid===m.uid})}).length;
        h+='<div class="w" style="grid-template-columns:1fr auto"><span><b>'+esc(pp.nick||'?')+'</b><br><span class="hint">'+weekXp(pp.xpd)+' XP / 7 · ✓ '+dn+'</span></span><button class="btn small ghost" type="button" data-mdel="'+esc(c.id)+'|'+esc(m.uid)+'">✕</button></div>';
      });
      CL.tasks.filter(function(t){return t.class_id===c.id}).forEach(function(t){
        var d=CL.done.filter(function(x){return x.task_id===t.id});
        h+='<div class="w" style="grid-template-columns:1fr auto"><span><b>'+esc(t.title)+'</b> <span class="badge">'+t.xp+' XP</span><br><span class="hint">'+d.length+'/'+mem.length+' ✓ '+esc(d.map(function(x){return (P[x.uid]||{}).nick||'?'}).join(', '))+'</span></span><span><button class="btn small ghost" type="button" data-tedit="'+esc(t.id)+'">✎</button> <button class="btn small ghost" type="button" data-tdel="'+esc(t.id)+'">✕</button></span></div>';
      });
      h+='<button class="btn ghost small" type="button" data-tnew="'+esc(c.id)+'">+ '+T('tNew')+'</button></div>';
    });
    el.innerHTML=h;
  }
  function renderCls(){
    var el=$('taskCard');if(!el)return;
    if(!hasProfile()||mode!=='db'||isOwner){el.hidden=true;return}
    el.hidden=false;
    var mine=CL.members.filter(function(m){return m.uid===uid}).map(function(m){return m.class_id});
    var h='<h2>'+T('myTasks')+'</h2>';
    if(!mine.length)h+='<div class="hint">'+T('tNoCls')+'</div><div class="row"><input id="jcCode" type="text" autocapitalize="characters" placeholder="'+esc(T('joinPh'))+'"><button class="btn" id="jcBtn" type="button">'+T('joinBtn')+'</button></div>';
    CL.tasks.filter(function(t){return mine.indexOf(t.class_id)>-1}).forEach(function(t){
      var done=CL.done.some(function(x){return x.task_id===t.id&&x.uid===uid});
      h+='<div class="w" style="grid-template-columns:1fr auto"><span><b>'+esc(t.title)+'</b> <span class="badge">'+t.xp+' XP</span>'+(t.due?'<br><span class="hint">⏰ '+esc(t.due)+'</span>':'')+'</span>'+
        (done?'<span class="badge">✓</span>':'<button class="btn small" type="button" data-tdo="'+esc(t.id)+'">'+T(t.kind==='quiz'?'tStart':'tFinish')+'</button>')+'</div>';
    });
    el.innerHTML=h;
  }
  async function finishTask(t,score){
    try{
      var x=await sb.from('task_done').insert({task_id:t.id,score:score});
      if(x.error){toast(T('tAuthErr')+x.error.message);return}
      CL.done.push({task_id:t.id,uid:uid,score:score});addXp(t.xp);toast(T('tDone',{x:t.xp}));renderCls();
    }catch(e){toast(T('tConnErr'))}
  }
  function taskResult(t,ok,n){if(ok/n>=.8)finishTask(t,ok);else toast(T('tFail'))}
  function doTask(t){
    if(t.kind!=='quiz'){finishTask(t,null);return}
    var src=String(t.words||'').split(/[\s,，、]+/).filter(function(h){return h&&hM(h)}).map(function(h){var l=hskLookup(h)||{};return {h:h,p:hP(h,l.p),m:hM(h)}});
    if(src.length<3){toast(T('tWords'));return}
    GM={mode:'mean',src:shuf(src),i:0,ok:0,all:gPool().all,task:t};
    showTab('play');$('plMenu').hidden=true;$('plGame').hidden=false;nextQ();
  }
  function askTask(cid,t){t=t||{};
    var title=prompt('Даалгаврын нэр',t.title||'');if(!title)return;
    var kind=prompt('Төрөл: quiz (үгийн тест) эсвэл free (чөлөөтэй)',t.kind||'quiz');if(kind===null)return;kind=kind.trim()==='free'?'free':'quiz';
    var words='';if(kind==='quiz'){words=prompt('Үгс таслалаар (жишээ: 爱,八,苹果)',t.words||'');if(words===null)return}
    var xp=prompt('XP',t.xp||20);if(xp===null)return;var due=prompt('Дуусах огноо YYYY-MM-DD (хоосон байж болно)',t.due||'');if(due===null)return;
    q(async function(){
      var pl={class_id:cid,title:title.trim(),kind:kind,words:words.trim(),xp:Math.max(1,+xp||20),due:/^\d{4}-\d{2}-\d{2}$/.test(due.trim())?due.trim():null};var r=t.id?await sb.from('tasks').update(pl).eq('id',t.id):await sb.from('tasks').insert(pl);
      if(r.error)throw r.error;refresh();
    });
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-tdo]');
    if(b){var t=CL.tasks.filter(function(x){return x.id===b.dataset.tdo})[0];if(t)doTask(t);return}
    if(e.target.closest('#jcBtn')){
      var c=$('jcCode').value.trim();if(!c)return;
      q(async function(){var r=await sb.rpc('join_class',{p_code:c});if(r.error)throw r.error;refresh()});return;
    }
    if(!isOwner)return;
    if(e.target.closest('#clAdd')){
      var n=$('clName').value.trim();if(!n)return;
      var code='';for(var i=0;i<6;i++)code+='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)];
      q(async function(){var r=await sb.from('classes').insert({name:n,code:code});if(r.error)throw r.error;refresh()});return;
    }
    b=e.target.closest('[data-tedit]');
    if(b){var tt=CL.tasks.filter(function(x){return x.id===b.dataset.tedit})[0];if(tt)askTask(tt.class_id,tt);return}
    b=e.target.closest('[data-cmem]');if(b){clOpen[b.dataset.cmem]=!clOpen[b.dataset.cmem];renderClasses();return}
    b=e.target.closest('[data-mdel]');
    if(b){var pr=b.dataset.mdel.split('|');if(confirm('?'))q(async function(){var r=await sb.from('class_members').delete().eq('class_id',pr[0]).eq('uid',pr[1]);if(r.error)throw r.error;refresh()});return}
    b=e.target.closest('[data-tnew]');if(b){askTask(b.dataset.tnew);return}
    b=e.target.closest('[data-tdel]');
    if(b&&confirm('?'))q(async function(){var r=await sb.from('tasks').delete().eq('id',b.dataset.tdel);if(r.error)throw r.error;refresh()});
  });
  /* ---------- search by handwriting (Google Input Tools recognition) ---------- */
  var hwInk=[],hwCv=null,hwCx=null,hwDraw=false,hwT0=0,hwTm=null;
  function hwPt(e){var r=hwCv.getBoundingClientRect();return [Math.round((e.clientX-r.left)*hwCv.width/r.width),Math.round((e.clientY-r.top)*hwCv.height/r.height),Math.round(performance.now()-hwT0)]}
  function hwRedraw(){
    hwCx.clearRect(0,0,280,280);hwCx.strokeStyle=cssv('--fg');hwCx.lineWidth=5;hwCx.lineCap='round';hwCx.lineJoin='round';
    hwInk.forEach(function(st){hwCx.beginPath();st[0].forEach(function(x,i){i?hwCx.lineTo(x,st[1][i]):hwCx.moveTo(x,st[1][i])});if(st[0].length===1)hwCx.lineTo(st[0][0]+.1,st[1][0]);hwCx.stroke()});
  }
  function hwReset(){hwInk=[];hwT0=performance.now();if(hwCx)hwRedraw();$('hwCand').innerHTML=''}
  function hwOpen(){
    $('hwModal').hidden=false;
    if(!hwCv){
      hwCv=$('hwCv');hwCx=hwCv.getContext('2d');
      hwCv.addEventListener('pointerdown',function(e){e.preventDefault();hwCv.setPointerCapture(e.pointerId);hwDraw=true;clearTimeout(hwTm);var p=hwPt(e);hwInk.push([[p[0]],[p[1]],[p[2]]])});
      hwCv.addEventListener('pointermove',function(e){if(!hwDraw)return;var p=hwPt(e),st=hwInk[hwInk.length-1];st[0].push(p[0]);st[1].push(p[1]);st[2].push(p[2]);hwRedraw()});
      var end=function(){if(!hwDraw)return;hwDraw=false;hwRedraw();hwTm=setTimeout(hwRecog,350)};
      hwCv.addEventListener('pointerup',end);hwCv.addEventListener('pointercancel',end);
    }
    hwReset();$('hwQ').textContent=$('hskQ').value;
  }
  async function hwRecog(){
    if(!hwInk.length)return;
    try{
      var r=await fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:280,writing_area_height:280},ink:hwInk,language:'zh_CN'}]})});
      var j=await r.json(),c=(j&&j[0]==='SUCCESS'&&j[1]&&j[1][0]&&j[1][0][1])||[];
      $('hwCand').innerHTML=c.slice(0,12).map(function(x){return '<button class="btn ghost" type="button" data-hwpick="'+esc(x)+'" lang="zh" style="font-size:1.4rem">'+esc(x)+'</button>'}).join('');
    }catch(x){$('hwCand').textContent=T('hwErr')}
  }
  document.addEventListener('click',function(e){
    if(e.target.closest('#hwOpen')){hwOpen();return}
    if(e.target.closest('#hwDone')||e.target.id==='hwModal'){$('hwModal').hidden=true;return}
    if(e.target.closest('#hwClear')){hwReset();return}
    if(e.target.closest('#hwUndo')){hwInk.pop();hwRedraw();clearTimeout(hwTm);if(hwInk.length)hwRecog();else $('hwCand').innerHTML='';return}
    var b=e.target.closest('[data-hwpick]');
    if(b){var i=$('hskQ');i.value+=b.dataset.hwpick;i.dispatchEvent(new Event('input',{bubbles:true}));$('hwQ').textContent=i.value;hwReset()}
  });
  var EMRE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/,BASE=location.origin+location.pathname;
  async function doAuth(up){
    var u=$('auUser').value.trim(),p=$('auPass').value,isMail=u.indexOf('@')>-1;
    if(up&&!EMRE.test(u)){toast(T('emailBad'));return}
    if(isMail?!EMRE.test(u):!/^[A-Za-z0-9_]{3,20}$/.test(u)){toast(T('tAuthBad'));return}
    if(p.length<6){toast(T('tAuthBad'));return}
    if(!sb)return;
    try{
      var v={email:isMail?u.toLowerCase():emailOf(u),password:p};
      var r=up?await sb.auth.signUp(Object.assign({options:{emailRedirectTo:BASE}},v)):await sb.auth.signInWithPassword(v);
      if(r.error){toast(T('tAuthErr')+r.error.message);return}
      if(!r.data||!r.data.session){toast(T('confirmMail'));return}
      await startSession(r.data.session.user);
    }catch(e){toast(T('tConnErr'))}
  }
  $('auIn').addEventListener('click',function(){doAuth(false)});
  $('auUp').addEventListener('click',function(){doAuth(true)});
  $('auForgot').addEventListener('click',async function(){
    var u=$('auUser').value.trim().toLowerCase();
    if(!EMRE.test(u)){toast(T('emailBad'));return}
    if(!sb)return;
    try{var r=await sb.auth.resetPasswordForEmail(u,{redirectTo:BASE});toast(r.error?T('tAuthErr')+r.error.message:T('forgotSent'))}catch(e){toast(T('tConnErr'))}
  });
  async function setPass(inp,done){
    var p=$(inp).value;if(p.length<6){toast(T('tAuthBad'));return}
    try{var r=await sb.auth.updateUser({password:p});if(r.error){toast(T('tAuthErr')+r.error.message);return}$(inp).value='';toast(T('resetDone'));if(done)done()}catch(e){toast(T('tConnErr'))}
  }
  $('rcSave').addEventListener('click',function(){setPass('rcPass',function(){$('recov').hidden=true})});
  $('acPassBtn').addEventListener('click',function(){setPass('acPass')});
  $('acMailBtn').addEventListener('click',async function(){
    var m=$('acMail').value.trim().toLowerCase();
    if(!EMRE.test(m)){toast(T('emailBad'));return}
    try{var r=await sb.auth.updateUser({email:m},{emailRedirectTo:BASE});toast(r.error?T('tAuthErr')+r.error.message:T('accSent'))}catch(e){toast(T('tConnErr'))}
  });
  $('signOut').addEventListener('click',async function(){try{await sb.auth.signOut()}catch(e){}location.reload()});
  (async function(){
    if(!SBCFG.url||!SBCFG.key||!window.supabase)return;
    try{
      sb=window.supabase.createClient(SBCFG.url,SBCFG.key);
      sb.auth.onAuthStateChange(function(ev){if(ev==='PASSWORD_RECOVERY'){var c=$('recov');c.hidden=false;c.scrollIntoView({block:'center'})}});
      var r=await sb.auth.getSession();
      if(r.data&&r.data.session)await startSession(r.data.session.user);
      else{authReady=true;renderAll()}
    }catch(e){toast(T('tConnErr'));authReady=true;needAuth=!uid;renderAll()}
  })();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
